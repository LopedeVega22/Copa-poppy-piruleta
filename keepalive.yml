# Evita que Supabase (plan gratuito) pause el proyecto por inactividad.
# Consulta la clasificación pública cada 3 días. No necesita secretos:
# la URL y la clave publishable ya son públicas en index.html.
name: keepalive
on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        run: |
          curl -fsS --retry 3 --max-time 30 \
            "https://dkcigtvxsntioxebrcwi.supabase.co/rest/v1/standings?select=name&limit=1" \
            -H "apikey: sb_publishable_6cDGfqVpwpngwVgrkV3Llw_Fi4fp3PS"
